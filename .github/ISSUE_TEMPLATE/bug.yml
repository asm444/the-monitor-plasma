name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u the-monitor -u the-monitor-coletor -n 50`. Remove hostnames or anything private.
      render: text
  - type: input
    id: versions
    attributes:
      label: Plasma version, distro, Python version
